<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Biblioteca{% endblock %} · Biblioteca</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>
    {% set section = request.blueprint or 'home' %}
    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="{{ url_for('index') }}">
Biblioteca</a>

            <button class="nav-toggle" type="button" aria-label="Apri menu" aria-expanded="false" data-nav-toggle>
                <i class="fa-solid fa-bars"></i>
            </button>

            <nav class="nav" data-nav>
                <a href="{{ url_for('index') }}" class="{{ 'active' if section == 'home' }}">Home</a>
                <a href="{{ url_for('books.list_books') }}" class="{{ 'active' if section == 'books' }}">Catalogo</a>
                <a href="{{ url_for('members.list_members') }}" class="{{ 'active' if section == 'members' }}">Soci</a>
                <a href="{{ url_for('loans.list_loans') }}" class="{{ 'active' if section == 'loans' }}">Prestiti</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flashes">
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}" role="alert">
                            <span>{{ message }}</span>
                            <button type="button" class="flash-close" aria-label="Chiudi" data-flash-close><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

</body>
</html>
